name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  MIN_LINE_COVERAGE: "85"
  MIN_BRANCH_COVERAGE: "80"

defaults:
  run:
    shell: bash # habilita -eo pipefail: falhas no meio de um pipe "| tee" quebram o job

jobs:
  lint:
    name: Lint & análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check . --output-format=github

      - name: Ruff (formatação)
        run: ruff format --check .

  tests:
    name: Testes & coverage gate
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt && mkdir -p reports/logs

      - name: Testes unitários
        run: |
          pytest tests/unit -m unit --cov --cov-report= \
            --junitxml=reports/junit-unit.xml | tee reports/logs/unit.log

      - name: Testes de integração
        run: |
          pytest tests/integration -m integration --cov --cov-append --cov-report= \
            --junitxml=reports/junit-integration.xml | tee reports/logs/integration.log

      - name: Testes E2E
        run: |
          pytest tests/e2e -m e2e --cov --cov-append --cov-report= \
            --junitxml=reports/junit-e2e.xml | tee reports/logs/e2e.log

      - name: Relatórios de cobertura
        if: always()
        run: |
          coverage report | tee reports/logs/coverage.log
          coverage xml
          coverage html
          coverage json

      - name: Coverage gate (linhas >= 85%, branches >= 80%)
        run: |
          python scripts/check_coverage.py reports/coverage.json \
            --lines "$MIN_LINE_COVERAGE" --branches "$MIN_BRANCH_COVERAGE" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            reports/coverage.xml
            reports/coverage.json
            reports/coverage-html/
            reports/junit-*.xml
            reports/logs/
          retention-days: 14

  load-test:
    name: Teste de carga (50 usuários)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt && mkdir -p reports/load

      - name: Subir a API
        run: |
          nohup uvicorn src.main:app --host 127.0.0.1 --port 8000 > reports/load/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "API não respondeu ao health check" && exit 1

      - name: Locust — 50 usuários simultâneos em /transfers
        run: |
          locust -f tests/load/locustfile.py --headless -u 50 -r 50 -t 30s \
            --host http://127.0.0.1:8000 --csv reports/load/wallet --only-summary \
            2>&1 | tee reports/load/locust.log

      - name: Taxa de erro e latência
        run: |
          echo "## Teste de carga — /transfers" >> "$GITHUB_STEP_SUMMARY"
          python scripts/load_report.py reports/load/wallet_stats.csv --max-error-rate 1.0 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultados do teste de carga
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: reports/load/
          retention-days: 14
