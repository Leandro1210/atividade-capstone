[project]
name = "wallet-api"
version = "1.0.0"
description = "Wallet API — microsserviço financeiro com suíte de self-testing multinível e CI"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "unit: testes de lógica pura (tests/unit)",
    "integration: testes com test doubles e SQLite em memória (tests/integration)",
    "e2e: testes ponta a ponta via HTTP (tests/e2e)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if __name__ == .__main__.:", "\\.\\.\\."]

[tool.coverage.html]
directory = "reports/coverage-html"

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.json]
output = "reports/coverage.json"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
